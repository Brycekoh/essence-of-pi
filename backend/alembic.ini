# Alembic configuration.
#
# The database URL is deliberately absent: it comes from DATABASE_URL via
# app.config.Settings, the same place the app reads it, so the migrations and
# the app can never disagree about which database they mean.
#
#   cd backend
#   DATABASE_URL=postgresql+psycopg://eop:eop@localhost:5432/essence_of_pi alembic upgrade head
#
# Under docker compose the `migrate` service runs this before the backend starts.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
